<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Clothes</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#1f2610; --muted:#5d6647;
  --olive:#5b6b21; --olive-deep:#3f4b14; --on-olive:#ffffff;
  --tint:#eef2d9; --pop:#d6e65c; --on-pop:#1f2610; --dot:#dfe5c4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141908; --surface:#1d2410; --ink:#f4f6e8; --muted:#aab38a;
    --olive:#a9bd3f; --olive-deep:#cfe06a; --on-olive:#1f2610;
    --tint:#2a3315; --dot:#252d12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141908; --surface:#1d2410; --ink:#f4f6e8; --muted:#aab38a;
  --olive:#a9bd3f; --olive-deep:#cfe06a; --on-olive:#1f2610;
  --tint:#2a3315; --dot:#252d12; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:18px 18px}
header{padding:26px 16px 10px;max-width:760px;margin:0 auto}
h1{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;font-weight:800;font-size:clamp(42px,13vw,68px);line-height:.95;
  letter-spacing:-.035em;text-transform:lowercase;margin:0;color:var(--olive-deep)}
h1 span{background:linear-gradient(transparent 60%,var(--pop) 60%);padding:0 4px}
.sub{margin:12px 0 0;color:var(--muted);font-weight:500;max-width:34ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;max-width:760px;margin:0 auto;border-bottom:2px solid var(--ink)}
.search{width:100%;padding:12px 18px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-weight:500}
.search::placeholder{color:var(--muted)}
.search:focus-visible,.chip:focus-visible,.size:focus-visible,.wa:focus-visible,.float:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 6px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:6px 15px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}
.chip[aria-pressed="true"]{background:var(--olive);color:var(--on-olive);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
main{max-width:760px;margin:0 auto;padding:18px 16px 100px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:5px 5px 0 var(--olive);transition:transform .12s,box-shadow .12s}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--olive)}
.pic{aspect-ratio:1/1;display:grid;place-items:center;font-size:64px;overflow:hidden;background:var(--tint)!important;border-bottom:2px solid var(--ink)}
.pic img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pic img{mix-blend-mode:normal}}
:root[data-theme="dark"] .pic img{mix-blend-mode:normal}
.info{padding:11px 12px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-weight:700;line-height:1.2;font-size:15px}
.price{align-self:flex-start;font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;font-weight:800;font-size:19px;line-height:1;
  background:var(--pop);color:var(--on-pop);border:2px solid var(--ink);border-radius:999px;padding:5px 11px;transform:rotate(-2deg)}
.ask{color:var(--muted);font-size:14px;font-weight:500}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{min-width:36px;padding:4px 9px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.size[aria-pressed="true"]{background:var(--olive);color:var(--on-olive)}
.wa{margin-top:auto;display:block;text-align:center;text-decoration:none;background:var(--olive-deep);color:var(--on-olive);font-weight:700;padding:10px;border-radius:12px;border:2px solid var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-weight:500}
.float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--olive);color:var(--on-olive);text-decoration:none;font-weight:700;
  padding:12px 18px;border-radius:999px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="shopName"></h1>
  <p class="sub" id="tag"></p>
</header>
<div class="bar">
  <input class="search" id="q" type="search" placeholder="Kapda dhundhiye (jaise jeans, hoodie)" aria-label="Kapda dhundhiye">
  <div class="chips" id="chips"></div>
</div>
<main><div class="grid" id="grid"></div></main>

const INK="#1d1b3a", SOFT="rgba(0,0,0,.35)";
function art(p){
  const f=p.col, S=`stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"`, L=`stroke="${SOFT}" stroke-width="1.4" fill="none" stroke-linecap="round"`;
  const tee=`<path d="M30 22L42 18Q50 26 58 18L70 22L84 38L74 46L68 40V82H32V40L26 46L16 38Z" fill="${f}" ${S}/>`;
  const longs=`<path d="M32 20L42 16Q50 24 58 16L68 20L90 70L78 74L68 46V84H32V46L22 74L10 70Z" fill="${f}" ${S}/>`;
  const jeans=(d)=>`<path d="${d}" fill="${f}" ${S}/><path d="M30 20H70" ${L}/>`;
  let b="";
  switch(p.shape){
    case "tee": b=tee+`<path d="M42 18Q50 26 58 18" ${L}/>`; break;
    case "boxy": b=`<path d="M24 24L40 19Q50 27 60 19L76 24L92 40L80 49L76 44V76H24V44L20 49L8 40Z" fill="${f}" ${S}/><path d="M40 19Q50 27 60 19" ${L}/>`; break;
    case "shirt": b=tee+`<path d="M42 18L50 32L58 18M50 32V82" ${L}/><circle cx="50" cy="44" r="1.3" fill="${SOFT}"/><circle cx="50" cy="56" r="1.3" fill="${SOFT}"/><circle cx="50" cy="68" r="1.3" fill="${SOFT}"/>`; break;
    case "polo": b=tee+`<path d="M42 18L50 30L58 18M50 30V46" ${L}/><circle cx="50" cy="36" r="1.3" fill="${SOFT}"/><circle cx="50" cy="42" r="1.3" fill="${SOFT}"/>`; break;
    case "jeans": b=jeans("M30 12H70L74 90H56L50 40L44 90H26Z")+`<path d="M50 20V40" ${L}/>`; break;
    case "baggy": b=jeans("M26 12H74L86 90H58L50 42L42 90H14Z")+`<path d="M50 20V42" ${L}/>`; break;
    case "slim": b=jeans("M34 12H66L68 90H54L50 40L46 90H32Z")+`<path d="M50 20V40" ${L}/>`; break;
    case "cargo": b=jeans("M26 12H74L86 90H58L50 42L42 90H14Z")+`<rect x="20" y="52" width="16" height="14" rx="2" ${L}/><rect x="64" y="52" width="16" height="14" rx="2" ${L}/><path d="M50 20V42" ${L}/>`; break;
    case "hoodie": b=longs+`<path d="M38 18Q50 2 62 18Q50 30 38 18Z" fill="${f}" ${S}/><path d="M40 58H60L63 72H37Z" ${L}/><path d="M46 28V40M54 28V40" ${L}/>`; break;
    case "jacket": b=longs+`<path d="M50 20V84" ${L}/><path d="M42 16L50 26L58 16" ${L}/><path d="M36 62H44M56 62H64" ${L}/>`; break;
    case "track": b=longs+`<path d="M50 20V84M32 46V84M68 46V84" ${L}/><path d="M42 16L50 26L58 16" ${L}/>`; break;
  }
  return `<svg viewBox="0 0 100 100" width="72%" height="72%" role="img" aria-label="${p.name}">${b}</svg>`;
}
const state = {cat:"Sab", q:"", sel:{}};
const $ = id => document.getElementById(id);
$("shopName").innerHTML = "<span></span>"; $("shopName").firstChild.textContent = SHOP.name;
$("tag").textContent = "Owner: " + SHOP.owner + ". " + SHOP.tagline;
document.title = SHOP.name;
$("floatWa").href = "https://wa.me/" + SHOP.whatsapp + "?text=" + encodeURIComponent("Namaste, mujhe kapdon ke baare mein poochna hai.");

const cats = ["Sab", ...new Set(PRODUCTS.map(p => p.cat))];
function drawChips(){
  $("chips").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c;
    b.setAttribute("aria-pressed", c === state.cat);
    b.onclick = () => { state.cat = c; drawChips(); drawGrid(); };
    $("chips").appendChild(b);
  });
}
function waLink(p){
  const size = state.sel[p.name] || p.sizes[0];
  const msg = "Namaste, mujhe yeh chahiye:\n" + p.name + "\nSize: " + size + (p.price ? "\nDaam: ₹" + p.price : "");
  return "https://wa.me/" + SHOP.whatsapp + "?text=" + encodeURIComponent(msg);
}
function drawGrid(){
  const q = state.q.trim().toLowerCase();
  const list = PRODUCTS.filter(p =>
    (state.cat === "Sab" || p.cat === state.cat) &&
    (!q || (p.name + " " + p.cat).toLowerCase().includes(q)));
  const g = $("grid"); g.innerHTML = "";
  if(!list.length){ g.innerHTML = '<div class="empty">Yeh kapda nahi mila. Dusra naam try karein.</div>'; return; }
  list.forEach(p => {
    const card = document.createElement("div"); card.className = "card";
    const sel = state.sel[p.name] || p.sizes[0];
    card.innerHTML =
      '<div class="pic" style="background:' + p.bg + '">' + (p.img ? '<img src="' + p.img + '" alt="' + p.name + '" loading="lazy">' : art(p)) + '</div>' +
      '<div class="info"><div class="name"></div>' + (p.price ? '<div class="price">₹' + p.price + '</div>' : '<div class="ask">Daam ke liye WhatsApp karein</div>') + '<div class="sizes"></div></div>';
    card.querySelector(".name").textContent = p.name;
    const sz = card.querySelector(".sizes");
    p.sizes.forEach(s => {
      const b = document.createElement("button");
      b.className = "size"; b.textContent = s;
      b.setAttribute("aria-pressed", s === sel);
      b.onclick = () => { state.sel[p.name] = s; drawGrid(); };
      sz.appendChild(b);
    });
    const a = document.createElement("a");
    a.className = "wa"; a.target = "_blank"; a.rel = "noopener";
    a.href = waLink(p); a.textContent = "WhatsApp pe order karein";
    card.querySelector(".info").appendChild(a);
    g.appendChild(card);
  });
}
$("q").addEventListener("input", e => { state.q = e.target.value; drawGrid(); });
drawChips(); drawGrid();
</script>
